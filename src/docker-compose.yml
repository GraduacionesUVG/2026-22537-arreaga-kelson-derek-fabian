services:
  api:
    build: .
    container_name: gp-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mongo
    volumes:
      - ./src:/code/src
      - ./main.py:/code/main.py
      - ./agent:/code/agent
      - ./scripts:/code/scripts
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mongo:
    image: mongo:7
    container_name: gp-agent-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: gp-agent-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo

  # Los dos servicios de abajo son opcionales (perfil "kafka") y no se
  # levantan con un `docker compose up` normal: se activan con
  # `docker compose --profile kafka up` y KAFKA_ENABLED=true.
  kafka:
    image: apache/kafka:3.7.0
    container_name: gp-agent-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: gp-agent-kafka-cluster

  worker:
    build: .
    container_name: gp-agent-worker
    profiles: ["kafka"]
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
    depends_on:
      - mongo
      - kafka
    volumes:
      - ./src:/code/src
    command: python -m src.worker

volumes:
  mongo_data:
