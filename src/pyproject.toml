[project]
name = "gp-agent-backend"
version = "0.1.0"
description = "Backend del sistema Caja Virtual Infinita (FastAPI + MongoDB), con orquestador conversacional LLM integrado via WhatsApp."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.1",
    "motor>=3.5.0",
    "pymongo>=4.7.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.1.0",
    "tzdata>=2024.1",
    "aiokafka>=0.11.0",
    "openpyxl>=3.1.2",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "mongomock-motor>=0.0.34",
]
loadtest = [
    "locust>=2.32",
    "websocket-client>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: llama a servicios externos reales (OpenAI, Meta); requiere credenciales en .env",
]
